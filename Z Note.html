<!doctype html>
<html lang="en" data-paper="cream" data-pattern="dots" data-ink="blue" data-head="hand" data-body="serif" data-size="m" data-width="normal">
<head>
<meta charset="utf-8">
<title>Z Note</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="app/img/icon.png">
<script>
  // Apply the saved style before first paint so the page never flashes the wrong paper.
  try {
    var zs = JSON.parse(localStorage.getItem('zn.style') || '{}');
    for (var zk in zs) document.documentElement.setAttribute('data-' + zk, zs[zk]);
  } catch (e) {}
</script>
<link rel="stylesheet" href="app/css/theme.css">
<link rel="stylesheet" href="app/css/shell.css">
<link rel="stylesheet" href="app/css/note.css">
<link rel="stylesheet" href="app/css/todo.css">
<link rel="stylesheet" href="app/css/board.css">
<link rel="stylesheet" href="app/css/snip.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="zn-rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <aside id="sidebar" aria-label="Notebooks"></aside>
  <main id="main">
    <header id="topbar"></header>
    <div id="view"></div>
  </main>
</div>
<div id="layer"></div>

<script src="app/js/util.js"></script>
<script src="app/js/icons.js"></script>
<script src="app/js/db.js"></script>
<script src="app/js/store.js"></script>
<script src="app/js/ui.js"></script>
<script src="app/js/awake-native.js"></script>
<script src="app/js/awake.js"></script>
<script src="app/js/templates.js"></script>
<script src="app/js/shell.js"></script>
<script src="app/js/home.js"></script>
<script src="app/js/note.js"></script>
<script src="app/js/todo.js"></script>
<script src="app/js/board.js"></script>
<script src="app/js/snip.js"></script>
<script src="app/js/search.js"></script>
<script src="app/js/settings.js"></script>
<script src="app/js/sync.js"></script>
<script src="app/js/setup.js"></script>
<script src="app/js/main.js"></script>
</body>
</html>
